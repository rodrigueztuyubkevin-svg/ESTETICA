{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Bienvenid@</h2>
    <p class="auth-subtitle">Ingresa tus datos para acceder a tu cuenta</p>
    <form method="POST">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Iniciar Sesión</button>
    </form>
    <p class="auth-footer">¿Aún no tienes una cuenta? <a href="{{ url_for('registro') }}" class="auth-link">Regístrate aquí</a></p>
</div>
{% endblock %}
