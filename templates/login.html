{% extends "base.html" %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    body {
        background-color: #f4f1ea;
    }
    .auth-card {
        background: #ffffff;
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    }
    .btn-auth {
        background-color: #2c3e50;
        color: white;
        border-radius: 50px;
        font-weight: 600;
        padding: 12px;
        transition: background 0.2s;
    }
    .btn-auth:hover {
        background-color: #1a252f;
        color: white;
    }
</style>

<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-flower1 text-success fs-1"></i>
                    <h2 class="fw-bold text-dark mt-2">Bienvenid@ a KAD</h2>
                    <p class="text-muted small">Ingresa tus datos para acceder a tu cuenta</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-secondary">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 bg-light rounded-end-3 py-2" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light rounded-end-3 py-2" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth w-100 shadow-sm mb-3">Iniciar Sesión</button>

                    <div class="text-center">
                        <p class="text-muted small mb-0">¿Aún no tienes una cuenta? <a href="{{ url_for('registro') }}" class="text-success text-decoration-none fw-semibold">Regístrate aquí</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
